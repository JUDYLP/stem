name: Publish static site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install development test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Build browser Pack Runtime
        run: npm run build:pack-runtime
      - name: Package static resources only
        run: python3 tools/package_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published static assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in src/fx/verdict-fx.js assets/fonts/doto-latin-wght-normal.woff2 data/packs/unscripted-intro.v1.json work/pack-runtime.mjs; do
            for attempt in {1..12}; do
              status=$(curl --silent --show-error --location --max-time 15 --output "$RUNNER_TEMP/published-asset" --write-out '%{http_code}' "${SITE_URL%/}/$asset") || status=000
              echo "$asset HTTP $status (attempt $attempt)"
              if [[ $status == 200 ]] && cmp -s "_site/$asset" "$RUNNER_TEMP/published-asset"; then break; fi
              if [[ $attempt == 12 ]]; then exit 1; fi
              sleep 5
            done
          done
