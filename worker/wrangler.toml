name = "unscripted-demo-proxy"
main = "index.js"
compatibility_date = "2026-11-19"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://judylp.github.io,http://127.0.0.1:5174,http://localhost:5174"
# Gemma comparison baseline: @cf/google/gemma-4-26b-a4b-it
MODEL = "@cf/openai/gpt-oss-120b"
DEADLINE_MS = "30000"
ENABLED = "true"
ALLOW_MEMORY_RATE_LIMIT = "false"

[[ratelimits]]
name = "DEMO_LIMITER"
namespace_id = "517406"

[ratelimits.simple]
limit = 6
period = 60
