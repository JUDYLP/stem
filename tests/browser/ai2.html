<!doctype html><meta charset="utf-8"><title>AI judging integration</title>
<pre id="result">PENDING</pre>
<iframe src="./index.html?lang=en"></iframe>
<script type="module">
import core from './data/packs/unscripted-core.v1.json' with {type:'json'};
import intro from './data/packs/unscripted-intro.v1.1.0.json' with {type:'json'};
import scenarios from './src/ai/demo-scenarios.json' with {type:'json'};
import {HOSTED_PROXY_URL,HOSTED_MODEL_LABEL} from "./src/ai/hosted.js";
const frame = document.querySelector('iframe');
const result = document.querySelector('#result');
const wait = () => new Promise(resolve => setTimeout(resolve, 25));
const assert = (condition, msg) => { if (!condition) throw Error(msg); };
async function run() {
  const w = frame.contentWindow;
  const el = id => w.document.getElementById(id);
  for (let i=0; i<160 && !el('question')?.options.length; i++) await wait();
  const input = (id, text) => {
    el(id).value = text;
    el(id).dispatchEvent(new w.Event('input'));
  };
  const select = (id, value) => {
    el(id).value = value;
    el(id).dispatchEvent(new w.Event('change'));
  };
  const pythonStart = intro.questions[0];
  assert(w.localStorage.getItem('unscripted.questionPack') === null &&
    el('question-pack').value === intro.packId && el('question').value === pythonStart.id &&
    el('layer-prompt').textContent === pythonStart.layers[0].prompt.en,
    'First visit should start at Python Intro L1');
  assert(el('load-message').textContent === intro.title.en+' · v1.1.0 · 2 questions',
    'English Intro should show two questions at the active version');
  const impacts = {
    'float-equality-v1': ["A loop that never stops, or a bill that's off by a cent","循环停不下来，或账单差一分钱"],
    'juc-volatile-atomicity-v2': ['A counter that silently loses updates under concurrency','计数器在并发下悄悄丢数'],
    'redis-expiration-v2': ['Cache entries that never expire until memory runs out','缓存永不过期，内存被撑爆'],
    'mysql-consistent-read-v2': ["Reading stale data while believing it's current","读到旧数据却以为是最新的"],
  };
  const setLanguage = lang => w.document.querySelector('[data-lang="'+lang+'"]').click();
  const assertImpact = (id, lang) => {
    const visible = el('question-impact');
    assert(!visible.hidden && visible.querySelector('strong').textContent ===
      (lang==='en'?'Why it matters':'答错会怎样') &&
      el('question-impact-text').textContent === impacts[id][lang==='en'?0:1],
      'Incorrect impact copy for '+id+' in '+lang);
  };
  assertImpact(pythonStart.id,'en');
  setLanguage('zh');
  assertImpact(pythonStart.id,'zh');
  setLanguage('en');
  const heroOption = el('hero-options').querySelector('.hero-option');
  assert(heroOption, 'Hero demo did not load');
  heroOption.click();
  select('question-pack',core.packId);
  assert(heroOption.getAttribute('aria-pressed') === 'true', 'Pack switch changed the hero demo selection');
  assert(el('load-message').textContent === core.title.en+' · v1.0.1 · 3 questions',
    'English Core question count must be plural');
  const options = [...el('question').options];
  assert(options.length === 3, 'Packaged app did not load all three Core topics');
  for (const topic of options) {
    select('question',topic.value);
    assertImpact(topic.value,'en');
    setLanguage('zh');
    assertImpact(topic.value,'zh');
    setLanguage('en');
  }
  select('question',options[0].value);
  const layer = index => el('depth-meter').querySelectorAll('button')[index].click();
  const status = () => el('ai-status').textContent;
  const snapshot = () => ['unscripted.progress.v1','unscripted.history.v1'].map(k=>w.localStorage.getItem(k)).join('|');
  const before = snapshot();
  if (HOSTED_PROXY_URL) {
    assert(el('ai-connection').value === 'hosted' && !el('ai-hosted-details').hidden,
      'Hosted proxy should be the default when configured');
    assert(el('ai-hosted-model').textContent === HOSTED_MODEL_LABEL, 'Missing model disclosure');
    input('answer','Hosted sample');
    el('answer-form').requestSubmit();
    select('judge-mode','live');
    let reportedModel = '@cf/google/gemma-4-26b-a4b-it';
    w.fetch = async (url,opts) => {
      assert(url.href === new URL(HOSTED_PROXY_URL).href &&
        !new w.Headers(opts.headers).has('Authorization'), 'Hosted success used the wrong transport');
      return new w.Response(JSON.stringify({model:reportedModel,choices:[
        {finish_reason:'stop',message:{content:'{"verdicts":[],"followUp":null}'}},
      ]}));
    };
    const hostedRun = el('ai-run').onclick();
    assert(status().includes('10–40 seconds'),'Hosted request did not explain the wait');
    await hostedRun;
    assert(status().includes('AI suggestion') && snapshot() === before,
      'Hosted completion did not reach the normal suggestion flow');
    assert(el('ai-hosted-model').textContent === reportedModel, 'Hosted label ignored the returned Gemma name');
    reportedModel = '@cf/qwen/qwen3.8-27b';
    await el('ai-run').onclick();
    assert(el('ai-hosted-model').textContent === reportedModel, 'Hosted label did not track a server-side model change');
    for (const code of [429,503]) {
      let request;
      w.fetch = async (url,opts) => {
        request = {url,opts};
        return new w.Response(null,{status:code});
      };
      await el('ai-run').onclick();
      assert(request.url.href === new URL(HOSTED_PROXY_URL).href &&
        !new w.Headers(request.opts.headers).has('Authorization'), 'Hosted request used the wrong transport');
      assert(status().includes('resets daily at 00:00 UTC') && !el('ai-offer-demo').hidden,
        'Hosted failure should offer the simulated demo');
    }
    el('ai-offer-demo').click();
    assert(el('judge-mode').value === 'demo' && !el('judge-demo').hidden,
      'Hosted failure button did not switch to Judge Demo');
    select('ai-connection','byok');
  } else {
    assert(!el('ai-connection').querySelector('[value="hosted"]') &&
      el('ai-connection').value === 'byok','Empty URL should retain the own-key mode');
  }
  select('ai-connection','custom');
  select('judge-mode','live');
  input('answer','Custom proxy sample');
  el('answer-form').requestSubmit();
  input('ai-proxy','https://custom-proxy.invalid/');
  let customRequest;
  w.fetch = async (url,opts) => {
    customRequest = {url,opts};
    return new w.Response(null,{status:429});
  };
  await el('ai-run').onclick();
  assert(customRequest.url.href === 'https://custom-proxy.invalid/' &&
    !new w.Headers(customRequest.opts.headers).has('Authorization') &&
    el('ai-offer-demo').hidden, 'Custom proxy should retain its original transport and error');
  select('ai-connection','byok');
  select('judge-mode','offline');
  let calls = 0;
  w.fetch = () => { calls++; throw Error('Unexpected network request'); };
  for (const topic of options) {
    select('question', topic.value);
    for (let i=0; i<3; i++) {
      layer(i);
      input('answer','My private draft');
      el('answer-form').requestSubmit();
      select('judge-mode','demo');
      el('demo-judge').click();
      const demo = el('judge-demo-result');
      const confirm = demo.querySelector('button.button');
      for (let tick=0; tick<200 && confirm.disabled; tick++) await wait();
      assert(!confirm.disabled, 'Demo animation did not finish');
      const lights = [...demo.querySelectorAll('.point-row')].map(e=>e.dataset.state);
      const expectedCount = el('rubric').querySelectorAll('.point-row').length;
      assert(lights.length === expectedCount && lights.length > 0, 'Demo rubric count mismatch');
      assert(lights.every(light => ['green','amber','red'].includes(light)), 'Invalid demo lamp state');
      demo.querySelector('.point-lamp').click();
      demo.querySelector('button.button').click();
      el('confirm-rating').click();
      select('judge-mode','offline');
      assert(el('answer').value === 'My private draft' && !el('self-check').hidden,'Lost real draft');
      assert(snapshot() === before, 'Demo changed learning records');
    }
  }
  select('judge-mode','demo');
  el('demo-judge').click();
  layer(0);
  assert(!w.document.querySelector('.fx-scanning, mark.fx-quote, .fx-score'), 'Navigation left demo effects');
  assert(calls === 0,'Demo called provider');
  select('judge-mode','live');
  await el('ai-run').onclick();
  assert(/key/i.test(status()), 'Missing key feedback');
  input('ai-key','synthetic');
  for (const change of [()=>select('question',options[0].value), ()=>layer(1),
      ()=>input('answer','edited'), ()=>input('ai-key','new-synthetic'), ()=>select('judge-mode','demo')]) {
    select('judge-mode','live');
    input('answer','Sample');
    el('answer-form').requestSubmit();
    let complete, signal;
    w.fetch = (_url, opts) => {
      signal = opts.signal;
      return new Promise(resolve=>{complete = resolve;});
    };
    const pending = el('ai-run').onclick();
    assert(el('ai-run').disabled, 'Duplicate request enabled');
    await el('ai-run').onclick();
    change();
    assert(signal.aborted, 'Old request still active');
    complete(new w.Response(JSON.stringify({choices:[{finish_reason:'stop',message:{content:'{"verdicts":[],"followUp":"STALE"}'}}]})));
    await pending;
    assert(!el('ai-followup').textContent.includes('STALE'),'Stale result reached UI');
  }
  select('judge-mode','live');
  input('answer','Ready for offline confirmation');
  el('answer-form').requestSubmit();
  w.fetch = () => Promise.reject(new w.DOMException('timeout','TimeoutError'));
  await el('ai-run').onclick();
  assert(!el('ai-run').disabled && /timed out|timeout/i.test(status()), 'Timeout recovery failed: '+status());
  w.fetch = () => Promise.reject(new w.TypeError('network error'));
  await el('ai-run').onclick();
  assert(!el('ai-run').disabled && snapshot()===before, 'Network failure changed records or blocked retry');
  // Exercise the production handler with a local completion, including a mid-reveal cancellation.
  select('question', options[0].value);
  input('answer','Sample evidence');
  el('answer-form').requestSubmit();
  w.fetch = async (_url, opts) => {
    const prompt = JSON.parse(opts.body).messages[0].content;
    const context = JSON.parse(prompt.slice(prompt.lastIndexOf('{"packId"')));
    const verdicts = context.criteria.map(({pointId}) => ({pointId,light:'green',reason:'Example',quote:'Sample'}));
    return new w.Response(JSON.stringify({choices:[{finish_reason:'stop',message:{content:JSON.stringify({verdicts,followUp:null})}}]}));
  };
  const live = el('ai-run').onclick();
  assert(el('before-answer').closest('details').open && el('confirm-rating').disabled,'Live scan or confirmation guard missing');
  for (let i=0; i<80 && !el('before-answer').querySelector('mark'); i++) await wait();
  assert(el('before-answer').querySelector('mark'),'Live reveal did not highlight evidence');
  layer(1);
  await live;
  assert(!w.document.querySelector('.fx-scanning, mark.fx-quote, .fx-pulse-dot, .fx-pulse-layer, .fx-score'),'Live effects survived navigation');
  layer(0);
  await el('ai-run').onclick();
  assert(!el('confirm-rating').disabled && [...el('rubric').children].every(row=>row.dataset.state==='green'),'Live verdict not adopted after playback');
  assert(snapshot() === before, 'Animation wrote a formal rating');
  select('judge-mode','offline');
  el('confirm-rating').click();
  assert(snapshot() !== before,'Offline confirmation did not save');

  for (const [q,index,answer,id] of [
    ['redis-expiration-v2',2,'INCR changes the value to 2.','redis-expiration-v2-l3-c05'],
    ['juc-volatile-atomicity-v2',0,'i++ is not atomic.','juc-volatile-atomicity-v2-l1-c02'],
  ]) {
    select('question', q);
    layer(index);
    select('judge-mode','live');
    input('answer',answer);
    el('answer-form').requestSubmit();
    w.fetch = async () => new w.Response(JSON.stringify({choices:[{finish_reason:'stop',message:{
      content:JSON.stringify({verdicts:[{pointId:id,light:'green',quote:answer,reason:'False Green'}],followUp:null}),
    }}]}));
    await el('ai-run').onclick();
    const point = [...el('rubric').children].at(-1);
    assert(point.dataset.state === 'amber' && !point.textContent.includes('False Green'),
      'Insufficient evidence reached the page as a Green');
  }

  const ts = '2026-11-19T00:00:00Z';
  const oldJava = {questionId:'juc-volatile-atomicity-v2',layer:'L1',ts,light:'red',
    pointLights:['green','amber','red'],missedPoints:[2],answer:'Old Java answer'};
  const oldRedis = {questionId:'redis-expiration-v2',layer:'L3',ts,light:'red',
    pointLights:['green','red','green','green'],missedPoints:[1],answer:'Old Redis answer'};
  const v1 = {schemaVersion:1,saveAnswers:true,entries:[oldJava,oldRedis]};
  const existingV1 = w.localStorage.getItem('unscripted.history.v1');
  const currentHistory = JSON.parse(existingV1).entries[0];
  assert(currentHistory.rubricSnapshot.packVersion === '1.0.1' &&
    currentHistory.rubricSnapshot.rubric.length === 2, 'New Java history snapshot mismatch');
  const rawHistory = JSON.stringify(v1);
  const rawProgress = w.localStorage.getItem('unscripted.progress.v1');
  w.localStorage.setItem('unscripted.history.v1', rawHistory);
  const versionEntry = {questionId:oldJava.questionId,layerId:'L1',packId:'unscripted-core',
    packVersion:'1.0.1',ts:'2026-11-19T01:00:00Z',light:'green',
    criterionResults:currentHistory.rubricSnapshot.rubric.map(({rubricId})=>({rubricId,light:'green'}))};
  const digest = async raw => {
    const hash = await w.crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return 'sha256:' + [...new Uint8Array(hash)].map(byte=>byte.toString(16).padStart(2,'0')).join('');
  };
  const transactionId = w.crypto.randomUUID();
  const migration = {transactionId,state:'committed',sourceHistoryDigest:await digest(rawHistory),
    sourceProgressDigest:await digest(rawProgress)};
  w.localStorage.setItem('unscripted.migration.v2.'+transactionId+'.backup',
    JSON.stringify({progress:rawProgress,history:rawHistory}));
  const progressV2 = {schemaVersion:2,saveAnswers:false,migration,packs:{'unscripted-core':{versions:{'1.0.1':{
    contentDigest:'sha256:'+'a'.repeat(64),
    items:{['unscripted-core::'+oldJava.questionId+'::L1']:{status:'pass',updatedAt:versionEntry.ts}},
    history:[versionEntry],
  }}}}};
  w.localStorage.setItem('unscripted.progress.v2', JSON.stringify(progressV2));
  const loaded = new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  frame.src = './index.html?lang=en&history-fixture';
  await loaded;
  for (let tick=0; tick<200 && el('timeline').children.length<3; tick++) await wait();
  const timeline = [...el('timeline').querySelectorAll('.tl-item')];
  assert(timeline.length === 3,'v1 and v2 did not appear together');
  const oldJavaRow = timeline.find(row=>row.textContent.includes('volatile does not automatically make compound operations'));
  const oldRedisRow = timeline.find(row=>row.textContent.includes('The original expiration time remains; the countdown does not restart.'));
  assert(oldJavaRow?.querySelectorAll('.tl-missed-list li').length === 3,'Java L1 lost historical c03');
  assert(oldRedisRow?.querySelectorAll('.tl-missed-list li').length === 4 &&
    oldRedisRow.textContent.includes('Old Redis answer'), 'Redis L3 lost historical criterion or answer');
  assert(timeline[0].textContent.includes('unscripted-core@1.0.1') &&
    timeline[0].querySelectorAll('.tl-missed-list li').length === 2,'Versioned Java history did not render');

  assert(el('question-pack').value === core.packId && el('load-message').textContent.includes('1.0.1'),
    'Saved Core pack should be restored after reload');
  assert([...el('question-pack').options].map(option=>option.textContent).join('|') ===
    'Core Software Engineering|Python Starter Pack', 'Builtin labels missing');
  const coreProgress = JSON.parse(w.localStorage.getItem('unscripted.progress.v1'));
  select('question',oldJava.questionId);
  select('judge-mode','live');
  input('answer','My Core draft');
  el('answer-form').requestSubmit();
  input('ai-key','synthetic');
  let finishCore, coreSignal;
  w.fetch = (_,opts) => {
    coreSignal = opts.signal;
    return new Promise(resolve=>{finishCore=resolve;});
  };
  const pendingCore = el('ai-run').onclick();

  const python = intro.questions[0];
  select('question-pack',intro.packId);
  assert(coreSignal.aborted, 'Pack switch did not abort Core request');
  finishCore(new w.Response(null,{status:429}));
  await pendingCore;
  assert(el('answer').value === '' && el('timeline').children.length === 0,'Core data leaked into Intro');
  assert(el('load-message').textContent.includes(intro.title.en) && el('load-message').textContent.includes('1.1.0'),
    'Intro pack or version was not displayed');
  assert(el('rubric-review').textContent.includes('awaiting human review'), 'Missing unreviewed status');
  const introQuestionIds = intro.questions.map(question => question.id);
  const visibleQuestionIds = () => [...el('question').options].map(option => option.value);
  assert(visibleQuestionIds().join() === introQuestionIds.join() && el('question').value === python.id,
    'Python questions missing');
  select('category',python.category['zh-CN']);
  el('random-question').click();
  assert(visibleQuestionIds().join() === introQuestionIds.join() &&
    introQuestionIds.includes(el('question').value) && el('category').options.length === 2,'Filters escaped Intro');
  select('question',python.id);
  assert(w.localStorage.getItem('unscripted.history.v1') === rawHistory,'Switching packs wrote history');
  assert(w.localStorage.getItem('unscripted.progress.v1') === rawProgress,'Switching packs wrote progress');

  const enDraft = 'Python is practicing the current layer.';
  w.document.querySelector('[data-lang="zh"]').click();
  assert(el('question-title').textContent === python.title['zh-CN'] &&
    el('layer-prompt').textContent === python.layers[0].prompt['zh-CN'],'Python Chinese copy mismatch');
  w.document.querySelector('[data-lang="en"]').click();
  assert(el('question-title').textContent === python.title.en,'Python English copy mismatch');
  let demoCalls = 0;
  w.fetch = () => {demoCalls++; throw Error('Simulated demo must stay offline');};
  select('judge-mode','demo');
  for (const [index, official] of python.layers.entries()) {
    layer(index);
    assert(el('layer-prompt').textContent === official.prompt.en,'Python layer prompt drift');
    el('demo-judge').click();
    const demo = el('judge-demo-result');
    const confirm = demo.querySelector('button.button');
    for (let tick=0; tick<200 && confirm.disabled; tick++) await wait();
    const preset = scenarios.find(row=>row.packId===intro.packId && row.layerId===official.id);
    assert(!confirm.disabled &&
      demo.querySelector('p.answer-text').textContent===preset.answer &&
      [...demo.querySelectorAll('.point-row')].map(row=>row.dataset.state).join()===preset.verdicts.map(v=>v.light).join(),
      'Python Demo mismatch at '+official.id);
    assert(el('judge-demo').querySelector('strong').textContent==='SIMULATED RESULT','Demo label missing');
    confirm.click();
  }
  assert(demoCalls===0 && w.localStorage.getItem('unscripted.history.v1')===rawHistory &&
    w.localStorage.getItem('unscripted.progress.v1')===rawProgress,'Python Demo altered stored records');

  select('judge-mode','live');
  for (const [index,official] of python.layers.entries()) {
    layer(index);
    input('answer',enDraft);
    el('answer-form').requestSubmit();
    let request;
    w.fetch = async (_url,opts) => {
      request = JSON.parse(opts.body).messages;
      const verdicts = official.rubric.map(({rubricId},i)=>({
        pointId:rubricId,light:i?'green':'red',reason:'Fixture result',quote:enDraft,
      }));
      return new w.Response(JSON.stringify({choices:[{finish_reason:'stop',message:{
        content:JSON.stringify({verdicts,followUp:null}),
      }}]}));
    };
    await el('ai-run').onclick();
    const prompt = request[0].content;
    const context = JSON.parse(prompt.slice(prompt.lastIndexOf('{"packId"')));
    assert(context.packId===intro.packId && context.packVersion===intro.packVersion &&
      context.questionId===python.id && context.layer===official.id &&
      JSON.stringify(context.criteria.map(row=>row.pointId))===JSON.stringify(official.rubric.map(row=>row.rubricId)) &&
      !prompt.includes('juc-volatile') && !prompt.includes('redis-expiration') && !prompt.includes('mysql-consistent') &&
      JSON.parse(request[1].content).answer===enDraft,'Python Live AI sent incorrect context');
    assert([...el('rubric').children].map(row=>row.dataset.state).join() === 'red,green,green',
      'Mock Python verdict failed to reach the UI');
  }

  el('confirm-rating').click();
  const updatedHistory = JSON.parse(w.localStorage.getItem('unscripted.history.v1'));
  assert(JSON.stringify(updatedHistory.entries.slice(0,2))===JSON.stringify(v1.entries),'Core v1 history was altered');
  const currentPython = updatedHistory.entries.at(-1);
  assert(currentPython.questionId===python.id && currentPython.rubricSnapshot.packId===intro.packId &&
    currentPython.rubricSnapshot.packVersion===intro.packVersion && currentPython.layer==='L3',
    'Python history was not versioned');
  const progressAfter = JSON.parse(w.localStorage.getItem('unscripted.progress.v1'));
  assert(JSON.stringify(progressAfter.items[oldJava.questionId+'::L1']) ===
    JSON.stringify(coreProgress.items[oldJava.questionId+'::L1']) &&
    progressAfter.items[python.id+'::L3'].status==='review','v1 progress compatibility failed');
  assert(el('timeline').children.length===1 && el('timeline').textContent.includes(intro.packId+'@'+intro.packVersion),
    'Python history did not render on its own');

  let exported;
  const createUrl = w.URL.createObjectURL;
  const clickLink = w.HTMLAnchorElement.prototype.click;
  try {
    w.URL.createObjectURL = blob => {exported=blob; return 'blob:mock-crash-sheet';};
    w.HTMLAnchorElement.prototype.click = () => {};
    el('export-review').click();
  } finally {
    w.URL.createObjectURL = createUrl;
    w.HTMLAnchorElement.prototype.click = clickLink;
  }
  const sheet = await exported.text();
  assert(sheet.includes(intro.packId+'@'+intro.packVersion) && sheet.includes('rounding') &&
    !sheet.includes(core.packId),'Python Crash Sheet contains incorrect criteria');
  select('question-pack',core.packId);
  assert(el('question').options.length===3 && el('answer').value==='My Core draft' &&
    el('timeline').children.length===3 && !el('timeline').textContent.includes(intro.packId),
    'Switch back to Core lost drafts or changed Core history');

}
try { await run(); result.textContent='AI2_BROWSER_PASS'; }
catch(error) { result.textContent='FAIL: '+error.message; }
</script>
